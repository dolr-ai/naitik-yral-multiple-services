[package]
name = "naitik-yral-multiple-services"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = { version = "0.15.7", optional = true }
serde = "=1.0.219"
serde_json = { version = "=1.0.143", default-features = false }
thiserror = { version = "2.0.12" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "http2",
] }
candid = "0.10.6"
anyhow = "1.0.86"
chrono = "0.4"
log = "0.4.27"
axum = { version = "0.8.0", features = ["macros", "json"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tokio = { version = "1.36.0", features = ["full"] }
sentry-tower = { version = "0.37.0", features = ["axum", "axum-matched-path"] }
futures = "0.3.30"
hmac = "0.12"
hex = "0.4.3"
sha2 = "0.10"
tracing = "0.1"
utoipa = { version = "5.3.1" }
utoipa-swagger-ui = { version = "9.0.2", features = ["reqwest", "axum"]}
rustls = { version = "0.23.26" }
jsonwebtoken = { version = "9.3.0", features = ["use_pem"] }
serde_with = "3.7.0"
config = { version = "0.14.0", features = ["toml"] }
once_cell = "1.19.0"
hyper-rustls = { version = "0.27.5", features = [
    "http2",
    "webpki-roots",
    "ring",
] }
yral-identity = { git = "https://github.com/dolr-ai/yral-common.git", default-features = false, branch = "master" }
ic-agent = { version = "0.41.0", default-features = false, features = ["pem"]}
sentry = { version = "0.37.0", default-features = false, features = [
    "rustls",
    "sentry-anyhow",
    "serde_json",
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "release-health",
    "reqwest",
] }
redis = { version = "0.32.7", features = [
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "aio",
    "json",
    "cluster",
    "cluster-async",
    "acl",
    "sentinel"
] }
yral-metadata-types = { git = "https://github.com/dolr-ai/yral-metadata", branch = "master", version = "0.1.0" }
yral-metrics = { git = "https://github.com/dolr-ai/yral-common", branch = "master" }
yral-types = { git = "https://github.com/dolr-ai/yral-common", branch = "master" }
sentry-tracing = "0.37.0"
hostname = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }