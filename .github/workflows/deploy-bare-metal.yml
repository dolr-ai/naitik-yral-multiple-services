name : Deploy to Hetzner Bare Metal

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_check:
    uses: ./.github/workflows/build-check.yml
    with:
      publish-artifact: true
    secrets: inherit

  build-and-push:
    name: Build and Push Docker Images
    needs: build_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-musl

      - name: Make binary executable
        run: chmod +x target/x86_64-unknown-linux-musl/release/naitik-yral-multiple-services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for naitik-yral-multiple-services
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push naitik-yral-multiple-services image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner Bare Metal
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - name: naitik-1
            host: 94.130.14.115
          - name: naitik-3
            host: 88.99.97.49
      max-parallel: 1
    
    steps:
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: naitik-yral-multiple-services-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CA_CERT value | DRAGONFLY_REDIS_STORE_CA_CERT ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CLIENT_CERT value | DRAGONFLY_REDIS_STORE_CLIENT_CERT ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CLIENT_KEY value | DRAGONFLY_REDIS_STORE_CLIENT_KEY ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_HOSTS value | DRAGONFLY_REDIS_STORE_HOSTS ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_PASSWORD value | DRAGONFLY_REDIS_STORE_PASSWORD ;
            secret/data/naitik-yral-multiple-services/YRAL_METADATA_TOKEN value | YRAL_METADATA_TOKEN ;
            secret/data/naitik-yral-multiple-services/OFFCHAIN_REQUEST_VERIFY_PUBLIC_KEY value | JWT_PUBLIC_KEY ;
            secret/data/naitik-yral-multiple-services/RECSYS_INTERNAL_CALL_SECRET_KEY value | RECSYS_INTERNAL_CALL_SECRET_KEY ;
            secret/data/naitik-yral-multiple-services/NAITIK_MACHINE_ACCESS_PRIVATE_KEY value | NAITIK_MACHINE_ACCESS_PRIVATE_KEY ;

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.NAITIK_MACHINE_ACCESS_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{matrix.server.host}} >> ~/.ssh/known_hosts

      - name: Check server connectivity
        run: |
          ssh -o ConnectTimeout=10 naitik@${{matrix.server.host}} "echo 'Server connection successful'"

      - name: Sync deployment files to server
        run: |
          rsync -avz --delete \
            ./deploy/ \
            naitik@${{matrix.server.host}}:/home/naitik/naitik-yral-multiple-services/

      - name: Log in to GitHub Container Registry on server
        run: |
          ssh naitik@${{matrix.server.host}} "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          "

      - name: Deploy to ${{ matrix.server.name }} with docker compose
        env:
          SERVER_HOST: ${{ matrix.server.host }}
          SERVER_USER: naitik
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_PUBLIC_KEY: ${{ env.JWT_PUBLIC_KEY }}
          RECSYS_INTERNAL_CALL_SECRET_KEY: ${{ env.RECSYS_INTERNAL_CALL_SECRET_KEY }}
          YRAL_METADATA_TOKEN: ${{ env.YRAL_METADATA_TOKEN }}
          DRAGONFLY_REDIS_STORE_CA_CERT: ${{ env.DRAGONFLY_REDIS_STORE_CA_CERT }}
          DRAGONFLY_REDIS_STORE_CLIENT_CERT: ${{ env.DRAGONFLY_REDIS_STORE_CLIENT_CERT }}
          DRAGONFLY_REDIS_STORE_CLIENT_KEY: ${{ env.DRAGONFLY_REDIS_STORE_CLIENT_KEY }}
          DRAGONFLY_REDIS_STORE_HOSTS: ${{ env.DRAGONFLY_REDIS_STORE_HOSTS }}
          DRAGONFLY_REDIS_STORE_PASSWORD: ${{ env.DRAGONFLY_REDIS_STORE_PASSWORD }}
        run: |
          # Create deployment directory if not exists
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p naitik-yral-multiple-services"
          
          ssh $SERVER_USER@$SERVER_HOST "
            cd naitik-yral-multiple-services
            
            echo 'Pulling latest images...'
            APP_IMAGE=ghcr.io/${{ github.repository }} \
            IMAGE_TAG=${{ github.sha }} \
            docker compose pull
            
            echo 'Stopping existing containers...'
            docker compose down --remove-orphans || true

            echo 'Starting services...'
            APP_IMAGE=ghcr.io/${{ github.repository }} \
            IMAGE_TAG=${{ github.sha }} \
            BIND_ADDRESS=0.0.0.0:6000 \
            JWT_PUBLIC_KEY='$JWT_PUBLIC_KEY' \
            RECSYS_INTERNAL_CALL_SECRET_KEY='$RECSYS_INTERNAL_CALL_SECRET_KEY' \
            YRAL_METADATA_TOKEN='$YRAL_METADATA_TOKEN' \
            DRAGONFLY_REDIS_STORE_PASSWORD='$DRAGONFLY_REDIS_STORE_PASSWORD' \
            DRAGONFLY_REDIS_STORE_HOSTS='$DRAGONFLY_REDIS_STORE_HOSTS' \
            DRAGONFLY_REDIS_STORE_CA_CERT='$DRAGONFLY_REDIS_STORE_CA_CERT' \
            DRAGONFLY_REDIS_STORE_CLIENT_CERT='$DRAGONFLY_REDIS_STORE_CLIENT_CERT' \
            DRAGONFLY_REDIS_STORE_CLIENT_KEY='$DRAGONFLY_REDIS_STORE_CLIENT_KEY' \
            docker compose up -d

            echo 'Waiting for services to start...'
            sleep 15
            echo 'Services status:'
            docker compose ps
          "
      
      - name: Verify deployment
        run: |
          ssh naitik@${{ matrix.server.host }} "
            cd naitik-yral-multiple-services
            echo '=== Container Status ==='
            docker compose ps
            echo ''
            echo '=== Container Logs (last 20 lines) ==='
            docker compose logs --tail=20 naitik-yral-multiple-services 2>/dev/null || echo 'Logs not yet available'
          "

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Server**: ${{ matrix.server.host }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Method**: Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "- **Images**:" >> $GITHUB_STEP_SUMMARY
          echo "  - ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Services**: naitik-yral-multiple-services" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets**: Injected via environment variables at runtime" >> $GITHUB_STEP_SUMMARY
      
      - name: Wait before next server
        run: |
          echo "Waiting 30 seconds before deploying to next server..."
          sleep 30