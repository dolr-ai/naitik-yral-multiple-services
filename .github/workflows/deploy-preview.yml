name: deploy preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  pull-requests: write
  contents: read
  packages: write
  deployments: write

jobs:
  build_check:
    uses: ./.github/workflows/build-check.yml
    with:
      publish-artifact: true
    secrets: inherit

  preview:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: build_check
    runs-on: ubuntu-latest
    
    concurrency:
      group: pr-${{ github.event.number }}-${{ github.event.repository.name }}
      cancel-in-progress: true

    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.meta.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          IMAGE="ghcr.io/${{ github.repository_owner }}/${REPO_NAME}"
          IMAGE_TAG="pr-${PR_NUMBER}"
          PREVIEW_DOMAIN="pr-${PR_NUMBER}-${REPO_NAME}.preview.yral.com"
          PREVIEW_URL="https://${PREVIEW_DOMAIN}"
          APP_NAME="pr-${PR_NUMBER}-${REPO_NAME}"
          
          echo "pr_number=${PR_NUMBER}"             >> $GITHUB_OUTPUT
          echo "repo_name=${REPO_NAME}"             >> $GITHUB_OUTPUT
          echo "image=${IMAGE}"                     >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}"             >> $GITHUB_OUTPUT
          echo "preview_domain=${PREVIEW_DOMAIN}"   >> $GITHUB_OUTPUT
          echo "preview_url=${PREVIEW_URL}"         >> $GITHUB_OUTPUT
          echo "app_name=${APP_NAME}"               >> $GITHUB_OUTPUT

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-musl

      - name: Fix Binary Permissions
        run: chmod +x target/x86_64-unknown-linux-musl/release/naitik-yral-multiple-services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile # Ensure you have a Dockerfile that copies the binary
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:cache-${{ steps.meta.outputs.image_tag }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:cache-${{ steps.meta.outputs.image_tag }},mode=max

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: naitik-yral-multiple-services-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CA_CERT value | DRAGONFLY_REDIS_STORE_CA_CERT ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CLIENT_CERT value | DRAGONFLY_REDIS_STORE_CLIENT_CERT ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_CLIENT_KEY value | DRAGONFLY_REDIS_STORE_CLIENT_KEY ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_HOSTS value | DRAGONFLY_REDIS_STORE_HOSTS ;
            secret/data/naitik-yral-multiple-services/DRAGONFLY_REDIS_STORE_PASSWORD value | DRAGONFLY_REDIS_STORE_PASSWORD ;
            secret/data/naitik-yral-multiple-services/YRAL_METADATA_TOKEN value | YRAL_METADATA_TOKEN ;
            secret/data/naitik-yral-multiple-services/NAITIK_MULTI_SERVICE_API_JWT_TOKEN value | NAITIK_MULTI_SERVICE_API_JWT_TOKEN ;
            secret/data/naitik-yral-multiple-services/OFFCHAIN_REQUEST_VERIFY_PUBLIC_KEY value | JWT_PUBLIC_KEY ;
            secret/data/naitik-yral-multiple-services/RECSYS_INTERNAL_CALL_SECRET_KEY value | RECSYS_INTERNAL_CALL_SECRET_KEY ;
            secret/data/naitik-yral-multiple-services/CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY value | CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY ;
            secret/data/naitik-yral-multiple-services/GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID value | GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID ;
            secret/data/naitik-yral-multiple-services/GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID value | GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID ;
            secret/data/naitik-yral-multiple-services/STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY value | STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY ;
            secret/data/naitik-yral-multiple-services/STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID value | STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID ;
            secret/data/naitik-yral-multiple-services/STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID value | STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID ;
            secret/data/naitik-yral-multiple-services/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            secret/data/naitik-yral-multiple-services/COOLIFY_PROJECT_UUID value | COOLIFY_PROJECT_UUID ;
            secret/data/naitik-yral-multiple-services/COOLIFY_SERVER_UUID value | COOLIFY_SERVER_UUID ;
            secret/data/naitik-yral-multiple-services/COOLIFY_ENV_UUID value | COOLIFY_ENV_UUID ;

      - name: Create or Get Coolify Application
        id: coolify_app
        run: |
          APP_NAME="${{ steps.meta.outputs.app_name }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          PREVIEW_DOMAIN="${{ steps.meta.outputs.preview_domain }}"

          # Check if app already exists for this PR (e.g. new commit pushed to same PR)
          EXISTING=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing Coolify app: $EXISTING"
            echo "app_uuid=${EXISTING}" >> $GITHUB_OUTPUT
          else
            echo "Creating new Coolify app: $APP_NAME"

            RESPONSE=$(curl -s -X POST \
              "https://coolify.yral.com/api/v1/applications/dockerimage" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${APP_NAME}\",
                \"project_uuid\": \"${COOLIFY_PROJECT_UUID}\",
                \"server_uuid\": \"${COOLIFY_SERVER_UUID}\",
                \"environment_name\": \"preview\",
                \"environment_uuid\": \"${COOLIFY_ENV_UUID}\",
                \"docker_registry_image_name\": \"${IMAGE}\",
                \"docker_registry_image_tag\": \"${IMAGE_TAG}\",
                \"domains\": \"https://${PREVIEW_DOMAIN}\",
                \"ports_exposes\": \"6000\",
                \"is_static\": false
              }")

            echo "Create response: $RESPONSE"

            APP_UUID=$(echo $RESPONSE | jq -r '.uuid // empty')

            if [ -z "$APP_UUID" ]; then
              echo "Failed to create Coolify application"
              echo "$RESPONSE"
              exit 1
            fi

            echo "app_uuid=${APP_UUID}" >> $GITHUB_OUTPUT
          fi

      - name: Push Environment Variables
        env:
          # Secrets from vault
          DRAGONFLY_REDIS_STORE_CA_CERT: ${{ env.DRAGONFLY_REDIS_STORE_CA_CERT }}
          DRAGONFLY_REDIS_STORE_CLIENT_CERT: ${{ env.DRAGONFLY_REDIS_STORE_CLIENT_CERT }}
          DRAGONFLY_REDIS_STORE_CLIENT_KEY: ${{ env.DRAGONFLY_REDIS_STORE_CLIENT_KEY }}
          DRAGONFLY_REDIS_STORE_HOSTS: ${{ env.DRAGONFLY_REDIS_STORE_HOSTS }}
          DRAGONFLY_REDIS_STORE_PASSWORD: ${{ env.DRAGONFLY_REDIS_STORE_PASSWORD }}
          JWT_PUBLIC_KEY: ${{ env.JWT_PUBLIC_KEY }}
          YRAL_METADATA_TOKEN: ${{ env.YRAL_METADATA_TOKEN }}
          NAITIK_MULTI_SERVICE_API_JWT_TOKEN: ${{ env.NAITIK_MULTI_SERVICE_API_JWT_TOKEN }}
          RECSYS_INTERNAL_CALL_SECRET_KEY: ${{ env.RECSYS_INTERNAL_CALL_SECRET_KEY }}
          CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ env.CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID: ${{ env.GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID }}
          GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID: ${{ env.GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID }}
          STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ env.STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY }}
          STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID: ${{ env.STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID }}
          STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID: ${{ env.STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID }}
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"
          flatten() { echo "$1" | tr -d '\n\r'; }

          ENV_JSON=$(jq -n \
            --arg dragonfly_redis_store_ca_cert "$DRAGONFLY_REDIS_STORE_CA_CERT" \
            --arg dragonfly_redis_store_client_cert "$DRAGONFLY_REDIS_STORE_CLIENT_CERT" \
            --arg dragonfly_redis_store_client_key "$DRAGONFLY_REDIS_STORE_CLIENT_KEY" \
            --arg dragonfly_redis_store_hosts "$DRAGONFLY_REDIS_STORE_HOSTS" \
            --arg dragonfly_redis_store_password "$DRAGONFLY_REDIS_STORE_PASSWORD" \
            --arg jwt_public_key "$JWT_PUBLIC_KEY" \
            --arg yral_metadata_token "$YRAL_METADATA_TOKEN" \
            --arg naitik_multi_service_api_jwt_token "$NAITIK_MULTI_SERVICE_API_JWT_TOKEN" \
            --arg recsys_internal_call_secret_key "$RECSYS_INTERNAL_CALL_SECRET_KEY" \
            --arg client_notifications_google_service_account_key "$(flatten "$CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY")" \
            --arg google_client_notifications_project_id "$GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID" \
            --arg google_client_notifications_sender_id "$GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID" \
            --arg staging_client_notifications_google_service_account_key "$(flatten "$STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY")" \
            --arg staging_google_client_notifications_project_id "$STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID" \
            --arg staging_google_client_notifications_sender_id "$STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID" \
            '{
              "data": [
                {"key": "DRAGONFLY_REDIS_STORE_CA_CERT", "value": $dragonfly_redis_store_ca_cert, "is_multiline": true},
                {"key": "DRAGONFLY_REDIS_STORE_CLIENT_CERT", "value": $dragonfly_redis_store_client_cert, "is_multiline": true},
                {"key": "DRAGONFLY_REDIS_STORE_CLIENT_KEY", "value": $dragonfly_redis_store_client_key, "is_multiline": true},
                {"key": "DRAGONFLY_REDIS_STORE_HOSTS", "value": $dragonfly_redis_store_hosts, "is_literal": true},
                {"key": "DRAGONFLY_REDIS_STORE_PASSWORD", "value": $dragonfly_redis_store_password, "is_literal": true},
                {"key": "JWT_PUBLIC_KEY", "value": $jwt_public_key, "is_multiline": true},
                {"key": "YRAL_METADATA_TOKEN", "value": $yral_metadata_token, "is_literal": true},
                {"key": "NAITIK_MULTI_SERVICE_API_JWT_TOKEN", "value": $naitik_multi_service_api_jwt_token, "is_literal": true},
                {"key": "RECSYS_INTERNAL_CALL_SECRET_KEY", "value": $recsys_internal_call_secret_key, "is_literal": true},
                {"key": "CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY", "value": $client_notifications_google_service_account_key, "is_literal": true},
                {"key": "GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID", "value": $google_client_notifications_project_id, "is_literal": true},
                {"key": "GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID", "value": $google_client_notifications_sender_id, "is_literal": true},
                {"key": "STAGING_CLIENT_NOTIFICATIONS_GOOGLE_SERVICE_ACCOUNT_KEY", "value": $staging_client_notifications_google_service_account_key, "is_literal": true},
                {"key": "STAGING_GOOGLE_CLIENT_NOTIFICATIONS_PROJECT_ID", "value": $staging_google_client_notifications_project_id, "is_literal": true},
                {"key": "STAGING_GOOGLE_CLIENT_NOTIFICATIONS_SENDER_ID", "value": $staging_google_client_notifications_sender_id, "is_literal": true}
              ]
            }')

          RESPONSE=$(curl -s -o /tmp/curl_response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${ENV_JSON}")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to push environment variables (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Update Image Tag and Deploy
        id: deploy
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          # Update image tag (important on subsequent pushes to same PR)
          curl -s -X PATCH \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"${IMAGE_TAG}\"}"

          # Trigger deploy
          RESPONSE=$(curl -s -X POST \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/start" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"uuid\": \"${APP_UUID}\",
              \"force\": true
            }")

          echo "Deploy response: $RESPONSE"

          DEPLOY_UUID=$(echo $RESPONSE | jq -r '.deployment_uuid // empty')
          if [ -z "$DEPLOY_UUID" ]; then
            echo "Failed to trigger deployment"
            echo "$RESPONSE"
            exit 1
          fi

          echo "deploy_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT

      - name: Wait for Deployment
        run: |
          DEPLOY_UUID="${{ steps.deploy.outputs.deploy_uuid }}"
          MAX_WAIT=120
          WAITED=0

          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s \
              "https://coolify.yral.com/api/v1/deployments/${DEPLOY_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              | jq -r '.status // empty')

            echo "Status: ${STATUS} (${WAITED}s elapsed)"

            if [ "$STATUS" = "finished" ]; then exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then exit 1
            fi

            sleep 10
            WAITED=$((WAITED + 10))
          done

          echo "Timed out"
          exit 1

  destroy-preview:
    if: ${{ github.event.pull_request.state == 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: import secrets from vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: naitik-yral-multiple-services-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/naitik-yral-multiple-services/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            
      - name: Compute Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          APP_NAME="pr-${PR_NUMBER}-${REPO_NAME}"
          echo "app_name=${APP_NAME}"   >> $GITHUB_OUTPUT
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Find and Delete Coolify Application
        run: |
          APP_NAME="${{ steps.meta.outputs.app_name }}"

          APP_UUID=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -z "$APP_UUID" ]; then
            echo "No app found for $APP_NAME — skipping"
            exit 0
          fi

          echo "Deleting Coolify app $APP_NAME ($APP_UUID)"

          curl -s -X DELETE \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"